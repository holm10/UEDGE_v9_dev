# Claude review — read-only. Runs the /code-review skill against the PR diff and
# posts the review as a PR comment. Claude reads code and comments; it never writes
# to the branch (contents: read).
#
# Fires only on demand, when a trusted contributor comments `@claude-review` on a PR (owner,
# 2026-11-24: the pipeline's review gates already review ticket PRs). The comment runs this file
# as it is on the default branch, with the token below: read a fork PR before asking for a
# review of it. Requires the CLAUDE_CODE_OAUTH_TOKEN repo/org secret.
name: Claude Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event.issue.pull_request
      && contains(github.event.comment.body, '@claude-review')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read         # read-only — the reviewer never edits the branch
      pull-requests: write   # post the review as a comment
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude-review"
          track_progress: true
          prompt: |
            Run the /code-review skill on this pull request.

            Review the full diff against the base branch. Load CLAUDE.md and the
            .claude/context/ modules matching the changed files, and apply the skill's
            UEDGE checklist: threadprivate state and loop ranges in the pandf tree,
            MPPL conversion hazards, .v declarations (units/defaults/docs), and the
            refactor-vs-physics defaults rule (refactors must not change results;
            physics changes to defaults must be documented in the PR).

            Post the review as a single PR comment. Be specific — cite file:line for
            every finding. Do not modify any files; this is a read-only review.
          claude_args: |
            --max-turns 60
