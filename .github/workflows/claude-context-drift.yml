name: AI layer drift and branch policy

# Guards the AI layer (CLAUDE.md, .claude/) against drifting from the code it describes.
# Policy: .claude/context/branching.md. Tools: .claude/hooks/check_context_refs.py, .claude/hooks/change_kind.py.

on:
  pull_request:
    branches: [v9-develop]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC, on the default branch checkout of v9-develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'v9-develop' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Branch policy (PRs)
        if: github.event_name == 'pull_request'
        run: |
          python3 .claude/hooks/change_kind.py \
            --range "origin/${{ github.base_ref }}...HEAD" \
            --branch "${{ github.head_ref }}"

      - name: AI-layer code references
        id: refs
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 .claude/hooks/check_context_refs.py --changed "origin/${{ github.base_ref }}" | tee refs.txt
          else
            python3 .claude/hooks/check_context_refs.py | tee refs.txt
          fi

      - name: Open an ai-layer issue on scheduled failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ai-layer --color 5319e7 --description "AI layer (CLAUDE.md, .claude/)" --force
          if [ -z "$(gh issue list --label ai-layer --state open --search 'AI layer drift in:title' --json number -q '.[].number')" ]; then
            { echo "The weekly drift check found AI-layer references that no longer match the code on v9-develop."; echo; echo '```'; cat refs.txt; echo '```'; echo; echo "Fix on a feature/v9-ai-* branch: re-read each claim, then \`check_context_refs.py --fix\` / \`--update\`."; } > body.md
            gh issue create --title "AI layer drift on v9-develop" --label ai-layer --body-file body.md
          fi
