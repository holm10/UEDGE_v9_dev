name: Build and test UEDGE - write wheel files if tests pass

# The yldot PR tier (epic AIUE-9, PRD sections 4 and 7.9; AIUE-103). build-serial builds the serial wheel once
# (Python 3.11, numpy==1.26.4, on the pinned ubuntu-24.04 image; owner D1, 2026-10-25) and lists the shards with
# tests/yldot/tools/shards.py: one per family plus "common". Each yldot-pr-tier leg installs that wheel with the test
# extra, restores tests/yldot/.data from the cache keyed by the manifests, runs tools/fetch_data.py (it checks the
# SHA-256 of every cached file and downloads what is absent, owner D2) and runs
# `pytest tests/yldot -n auto -m "not nightly" --yldot-shard <shard>`. A test is in exactly one shard (its "family"
# parameter, else common; owner D3), so the legs together run the whole PR tier once. The wheel jobs need the tier and
# run only on pushes to v9-develop, main and tags (owner D5). Locally: pip install ".[test]" and
# pytest tests/yldot -n auto -m "not nightly" (.claude/context/testing.md).

on: [push, pull_request]

permissions:
  contents: read

jobs:

  check-requests:
    name: Checks whether tests and/or wheels are requested
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set UBUNTU tags env variables.
      if: runner.os == 'Linux'
      run: |
          # Set "checking" variable to false by default.
          # Get your last commit message, not the merge commit.
          text=$(git log -1 --no-merges --pretty=%B)
          # Tags sit on a line that starts with "#", e.g. "#@notest @nowheel".
          # Only those lines count: a squash title ends in "(#N)".
          tags=$(grep -E '^#[[:space:]]*@' <<< "$text" | grep -oE '@[a-z]+' | tr '\n' ' ' || true)
          # Sanity check.
          echo "Tags are: ${tags}"
          # Add tags and overwrite "checking" variable to true if there are tags.
          if [[ "${tags}" == *"@notest"*  ]]; then
              echo "Seting test flags to FALSE"
              echo "test=FALSE" >> $GITHUB_OUTPUT
          else
              echo "Seting test flags to TRUE"
              echo "test=TRUE" >> $GITHUB_OUTPUT
          fi
          if [[ "${tags}" == *"@nowheel"*  ]]; then
              echo "Seting wheel flags to FALSE"
              echo "wheel=FALSE" >> $GITHUB_OUTPUT
          else
              echo "Seting wheel flags to TRUE"
              echo "wheel=TRUE" >> $GITHUB_OUTPUT
          fi



  build-serial:
    name: Builds the serial wheel once
    runs-on: ubuntu-24.04
    needs: check-requests
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install pip dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "forthon>=0.10.7" numpy==1.26.4 h5py setuptools wheel

    - name: Build the serial wheel
      run: |
        gfortran --version | head -1
        t0=$(date +%s)
        python -m pip wheel -v --no-build-isolation --no-deps -w dist . -C "--build-option=--serial"
        line="Serial wheel $(ls dist) built in $(( $(date +%s) - t0 )) s"
        echo "$line"
        echo "$line" >> "$GITHUB_STEP_SUMMARY"

    - name: List the yldot shards
      id: shards
      run: |
        shards=$(python tests/yldot/tools/shards.py)
        echo "Shards: $shards"
        echo "shards=$shards" >> "$GITHUB_OUTPUT"

    - name: Upload the wheel
      uses: actions/upload-artifact@v4
      with:
        name: uedge-serial-wheel
        path: dist/*.whl
        if-no-files-found: error
        retention-days: 7


  yldot-pr-tier:
    name: yldot PR tier (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: [check-requests, build-serial]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build-serial.outputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
    - name: Record start time
      run: echo "YLDOT_T0=$(date +%s)" >> "$GITHUB_ENV"

    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Download the serial wheel
      uses: actions/download-artifact@v4
      with:
        name: uedge-serial-wheel
        path: dist

    - name: Install the wheel with the test extra
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$(ls dist/*.whl)[test]" numpy==1.26.4
        python -m pip list | grep -i -E "^(uedge|numpy|h5py|forthon|pytest)"

    - name: Smoke test
      run: |
        cd /tmp && python -I -c "from uedge import bbb; print(bbb.uedge_ver)"

    - name: Restore the release assets
      uses: actions/cache@v4
      with:
        path: tests/yldot/.data
        key: yldot-data-${{ hashFiles('tests/yldot/references/*.manifest.json') }}

    - name: Fetch and verify the release assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python tests/yldot/tools/fetch_data.py

    - name: Test with pytest
      run: |
        echo "nproc $(nproc)"
        python -m pytest tests/yldot -n auto -m "not nightly" --yldot-shard "$SHARD" --timeout 900 \
            -p no:cacheprovider -ra --junitxml "junit-$SHARD.xml"

    - name: Wall time
      if: always()
      run: |
        line="yldot PR tier $SHARD: job wall time $(( $(date +%s) - YLDOT_T0 )) s"
        echo "$line"
        echo "$line" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the junit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: yldot-junit-${{ matrix.shard }}
        path: junit-${{ matrix.shard }}.xml
        if-no-files-found: warn
        retention-days: 30


  build_wheels:
    name: Build wheels on ${{ matrix.os }} for Python ${{ matrix.pyver }}
    needs: [yldot-pr-tier, check-requests]
    # Wheels only on pushes to v9-develop, main and tags (owner D5, AIUE-103); the matrix itself is a follow-up ticket
    if: >-
      needs.check-requests.outputs.wheels != 'TRUE' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/v9-develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14] 
        pyver: [cp38, cp39, cp310, cp311, cp312]

    steps:
      - name: Checks out repo
        uses: actions/checkout@v4

      - name: Set up macOS-specific paths and libraries
        if: runner.os == 'macOS'
        run: |
            # Symlink the correct gfortran compiler 
            ln -s $(brew --prefix)/bin/gfortran-13 $(brew --prefix)/bin/gfortran
            # Install OMP libraries
            brew install libomp
            # Link environments to env for later us with cibuildwheel
            echo "LIBOMPPATH=$(brew --prefix libomp)" >> $GITHUB_ENV
            echo "LLVMCLANG=$(brew --prefix llvm@15)" >> $GITHUB_ENV

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.17.0
        env:
            CIBW_BUILD: ${{matrix.pyver}}-*
            CIBW_SKIP: "pp37-* cp37-* *-win32 *-manylinux_i686"
            CIBW_ARCHS_LINUX: auto
            CIBW_BEFORE_BUILD: pip install numpy 'forthon>=0.10.7' 'build<0.10.0'
            CC: ${{ env.LLVMCLANG }}/bin/clang
            LDFLAGS: "-L${{env.LIBOMPPATH }}/lib"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.pyver }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_wheels_pypy:
    name: Build PyPy wheels on ${{ matrix.os }} 
    if: false
#    if: github.event_name == 'pull_request'
    needs: yldot-pr-tier
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14] 

    steps:
      - name: Checks out repo
        uses: actions/checkout@v4

      - name: Set up macOS-specific paths and libraries
        if: runner.os == 'macOS'
        run: |
            # Symlink the correct gfortran compiler 
            ln -s $(brew --prefix)/bin/gfortran-13 $(brew --prefix)/bin/gfortran
            # Install OMP libraries
            brew install libomp
            # Link environments to env for later us with cibuildwheel
            echo "LIBOMPPATH=$(brew --prefix libomp)" >> $GITHUB_ENV
            echo "LLVMCLANG=$(brew --prefix llvm@15)" >> $GITHUB_ENV

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.17.0
        env:
            CIBW_BUILD: pp*
            CIBW_SKIP: "pp37-* cp37-* *-win32 *-manylinux_i686"
            CIBW_BEFORE_BUILD: pip install numpy 'forthon>=0.10.7' 'build<0.10.0'
            CC: ${{ env.LLVMCLANG }}/bin/clang
            LDFLAGS: "-L${{env.LIBOMPPATH }}/lib"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-pyp-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_wheels_cross:
    name: Build Linux cross-wheels
    if: false
    needs: yldot-pr-tier
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        pyver: [cp38, cp39, cp310, cp311, cp312]
        arch: [aarch64, ppc64le]

    steps:
      - name: Checks out repo
        uses: actions/checkout@v4
    
      - name: Set up QEMU for multi-arch build
        uses: docker/setup-qemu-action@v2

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.17.0
        env:
            CIBW_BUILD: ${{matrix.pyver}}-*
            IBW_SKIP: cp37-*
            CIBW_ARCHS: ${{matrix.arch}}
            CIBW_BEFORE_BUILD: pip install numpy 'forthon>=0.10.7' 'build<0.10.0'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-cross-wheels-${{ matrix.arch }}-${{ matrix.pyver }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_wheels_cross_pypy:
    name: Build Linux PyPy cross-wheels
    if: false
    needs: yldot-pr-tier
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false

    steps:
      - name: Checks out repo
        uses: actions/checkout@v4
    
      - name: Set up QEMU for multi-arch build
        uses: docker/setup-qemu-action@v2

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.17.0
        env:
            CIBW_BUILD: pp*
            CIBW_SKIP: "pp37-* cp37-* *-win32 *-manylinux_i686"
            CIBW_BEFORE_BUILD: pip install numpy 'forthon>=0.10.7' 'build<0.10.0'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-cross-wheels-pypy-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  gather_wheels:
    name: Gather built wheels
    needs: [build_wheels] #, build_wheels_pypy]
#    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all Artifacts and merges them
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: cibw-*
          merge-multiple: true

      - name: Upload all Artifacts in a single Archive
        uses: actions/upload-artifact@v4
        with:
          name: all_wheels
          path: wheels
