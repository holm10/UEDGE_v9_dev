name: Build and test UEDGE - write wheel files if tests pass

# The yldot PR tier (epic AIUE-9, PRD sections 4 and 7.9; AIUE-103). build-serial builds the serial wheel once
# (Python 3.11, numpy==1.26.4, on the pinned ubuntu-24.04 image; owner D1, 2026-10-25) and lists the shards with
# tests/yldot/tools/shards.py: one per family plus "common". Each yldot-pr-tier leg installs that wheel with the test
# extra, restores tests/yldot/.data from the cache keyed by the manifests, runs tools/fetch_data.py (it checks the
# SHA-256 of every cached file and downloads what is absent, owner D2) and runs
# `pytest tests/yldot -n auto -m "not nightly" --yldot-shard <shard>`. A test is in exactly one shard (its "family"
# parameter, else common; owner D3), so the legs together run the whole PR tier once. The wheel jobs need the tier and
# run only on pushes to v9-develop, main and tags (owner D5). Locally: pip install ".[test]" and
# pytest tests/yldot -n auto -m "not nightly" (.claude/context/testing.md).

# A push or PR that changes only AI-layer files (process paths) runs nothing here (owner, 2026-10-28). The list is
# the PROCESS pattern of .claude/hooks/change_kind.py; keep the two in step. One product file in the change runs
# everything. Path filters are not evaluated for tag pushes, so wheel builds on tags are unaffected.
on:
  push:
    paths-ignore:
      - "CLAUDE.md"
      - ".mcp.json"
      - ".claude/**"
      - ".githooks/**"
      - ".github/workflows/claude-*.yml"
      - ".github/workflows/claude-*.yaml"
  pull_request:
    paths-ignore:
      - "CLAUDE.md"
      - ".mcp.json"
      - ".claude/**"
      - ".githooks/**"
      - ".github/workflows/claude-*.yml"
      - ".github/workflows/claude-*.yaml"

permissions:
  contents: read

jobs:

  build-serial:
    name: Builds the serial wheel once
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install pip dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "forthon>=0.10.7" numpy==1.26.4 h5py setuptools wheel

    - name: Build the serial wheel
      run: |
        gfortran --version | head -1
        t0=$(date +%s)
        python -m pip wheel -v --no-build-isolation --no-deps -w dist . -C "--build-option=--serial"
        line="Serial wheel $(ls dist) built in $(( $(date +%s) - t0 )) s"
        echo "$line"
        echo "$line" >> "$GITHUB_STEP_SUMMARY"

    - name: List the yldot shards
      id: shards
      run: |
        shards=$(python tests/yldot/tools/shards.py)
        echo "Shards: $shards"
        echo "shards=$shards" >> "$GITHUB_OUTPUT"

    - name: Upload the wheel
      uses: actions/upload-artifact@v4
      with:
        name: uedge-serial-wheel
        path: dist/*.whl
        if-no-files-found: error
        retention-days: 7


  yldot-pr-tier:
    name: yldot PR tier (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: build-serial
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build-serial.outputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
    - name: Record start time
      run: echo "YLDOT_T0=$(date +%s)" >> "$GITHUB_ENV"

    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Download the serial wheel
      uses: actions/download-artifact@v4
      with:
        name: uedge-serial-wheel
        path: dist

    - name: Install the wheel with the test extra
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$(ls dist/*.whl)[test]" numpy==1.26.4
        python -m pip list | grep -i -E "^(uedge|numpy|h5py|forthon|pytest)"

    - name: Smoke test
      run: |
        cd /tmp && python -I -c "from uedge import bbb; print(bbb.uedge_ver)"

    - name: Restore the release assets
      uses: actions/cache@v4
      with:
        path: tests/yldot/.data
        key: yldot-data-${{ hashFiles('tests/yldot/references/*.manifest.json') }}

    - name: Fetch and verify the release assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python tests/yldot/tools/fetch_data.py

    - name: Test with pytest
      run: |
        echo "nproc $(nproc)"
        python -m pytest tests/yldot -n auto -m "not nightly" --yldot-shard "$SHARD" --timeout 900 \
            -p no:cacheprovider -ra --junitxml "junit-$SHARD.xml"

    - name: Wall time
      if: always()
      run: |
        line="yldot PR tier $SHARD: job wall time $(( $(date +%s) - YLDOT_T0 )) s"
        echo "$line"
        echo "$line" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the junit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: yldot-junit-${{ matrix.shard }}
        path: junit-${{ matrix.shard }}.xml
        if-no-files-found: warn
        retention-days: 30


  build_wheels:
    name: Build wheels on ${{ matrix.os }} for Python ${{ matrix.pyver }}
    needs: yldot-pr-tier
    # Wheels only on pushes to v9-develop, main and tags (owner D5, AIUE-103). Legs, build options and the cp315 test
    # skip: owner decisions of T145 (2026-11-26). cibuildwheel v4 builds manylinux_2_28; it no longer builds cp38.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/v9-develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') ||
       github.ref == 'refs/heads/feature/v9-T145-wheel-matrix')
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
        # No cp39: uedge does not import on Python 3.9 (src/uedge/__init__.py: a `str | None` annotation; owner, T145)
        pyver: [cp310, cp311, cp312, cp313, cp314, cp315]

    steps:
      - name: Checks out repo
        uses: actions/checkout@v4

      - name: Set up the macOS compilers and OpenMP
        if: runner.os == 'macOS'
        run: |
            # Forthon calls "gfortran"; the macos-15 images have gfortran-13/14/15 and llvm@18 (no llvm@15)
            ln -sf "$(brew --prefix)/bin/gfortran-14" "$(brew --prefix)/bin/gfortran"
            brew install libomp
            {
              echo "CC=$(brew --prefix llvm@18)/bin/clang"
              echo "LDFLAGS=-L$(brew --prefix libomp)/lib"
              # delocate refuses bundled libraries (Homebrew's libgfortran, libomp) newer than the wheel's target
              echo "MACOSX_DEPLOYMENT_TARGET=15.0"
            } >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
            CIBW_BUILD: ${{ matrix.pyver }}-*
            CIBW_SKIP: "*-musllinux_*"
            # Build without isolation: [build-system] requires lists h5py, which has no wheel for every image and
            # Python, and its source build needs libhdf5 (T145). before_build installs what the build needs.
            CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
            CIBW_BEFORE_BUILD: pip install numpy 'forthon>=0.10.7' 'setuptools>=77' wheel
            CIBW_TEST_COMMAND: cd / && python -I -c "from uedge import bbb; print(bbb.uedge_ver)"
            # Installing the wheel pulls in h5py, which has no cp315 wheel yet (h5py 3.16.0, 2026-11-26): lift this
            # skip once PyPI has h5py cp315 wheels (owner, T145)
            CIBW_TEST_SKIP: "cp315-*"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.pyver }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  gather_wheels:
    name: Gather built wheels
    needs: [build_wheels]
    # Collects every wheel that was built, also when a leg failed or GitHub cancelled it for lack of runners (owner,
    # T145); skipped with build_wheels (pull requests, other branches)
    if: ${{ !cancelled() && needs.build_wheels.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all Artifacts and merges them
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: cibw-*
          merge-multiple: true

      - name: Upload all Artifacts in a single Archive
        uses: actions/upload-artifact@v4
        with:
          name: all_wheels
          path: wheels
