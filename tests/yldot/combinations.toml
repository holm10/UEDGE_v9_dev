# Combination sets of the yldot suite (AIUE-257; owner D1, 2026-11-11; read by harness/variants.py load_sets).
#
# A set assigns several inputs at once, so a branch that only a combination reaches is taken in a stored, checked
# configuration, and a parameter that only a non-default branch reads is varied while that branch is on. One table
# per set, id "set:<name>" (lower case letters, digits, '_', '-', '.'). Fields:
#   assign   = { "pkg.var" = <value>, ... }  required; every key's d is read first, then the values are assigned in
#                                             this order. A value is
#              a number                       at every element (elementwise, like a value of overrides.toml)
#              { value = x, at = [i, ...] }   x at d[i, ...] (numpy indices: the Fortran index minus its lower bound)
#              { scale = x, at = [...] }      d[at] * x (real variables only)
#              { cycle = [a, b], at = [...] } along the 0:nx+1 axis of d[at], cell i takes entry i mod n of the list
#                                             (the other axes broadcast); at must reach that axis
#   reason   = "..."                          required: the branch the set takes (pandf_boundary.m lines)
#   base     = "set:<name>"                   optional: classified against that set's result instead of the family
#                                             default (the base has no base; full-store families only)
#   families = ["d_only", ...]                default: the five small families (owner D3)
#   phase    = "PRE" | "POST"                 default: POST if any key is a dynamic array, else PRE
#   config   = "steady" | "timestep"          default: steady
#   issues   = ["AIUE-260", ...]              the AIUE-259 issues the set covers as the code behaves today (owner D4)
#
# A per-cell wall array (bbb.istepfcix, bbb.lyteix, ...) needs its switch (bbb.ispfbcvsix or bbb.iswobcvsix) = 1 in
# the same set: setwallbcarrays (bbb/odesetup.m:548) overwrites it from the scalar otherwise. A key that
# overrides.toml EXCLUDES cannot be assigned. A based set assigns every key of its base (load_sets checks it), with
# the base's values except the parameter it varies, so the base's branch stays on. Owner rule (decision 23): a set that comes out INVALID is stored as INVALID with its
# reason; never tune its values to make it pass. Lines below are bbb/pandf_boundary.m at a62f121.

# ---------------------------------------------------------------- plates (Task 3 prototype)

["set:ibctepl0"]
assign = { "bbb.ibctepl" = 0 }
reason = "left-plate Te fixed at tepltl (ibctepl = 0, 3381)"

["set:ibctepl0-tepltl"]
assign = { "bbb.ibctepl" = 0, "bbb.tepltl" = { scale = 1.5 } }
base = "set:ibctepl0"
reason = "tepltl, read only under ibctepl = 0 (3382), varied with that branch on"

