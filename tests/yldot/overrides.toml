# Per-variable overrides of the yldot variant rules (epic AIUE-9, PRD section 7.2; read by harness/variants.py).
#
# One table per package-qualified key. Fields:
#   reason  = "..."                  required, non-empty: why the entry exists
#   add     = true                   the variable is not tagged +input/+maybeinput and is added to the inventory
#   exclude = true                   EXCLUDED: never run, the reason goes into every manifest
#   values  = [...]                  explicit variant values, one variant each (instead of the default rule)
#   others  = "..."                  with values: every other value is EXCLUDED with this reason
#   bound   = "pkg.var"              bounded-index rule: d+1 if <= the bound's live value, else d-1 if >= 1, else d
#   charge  = "pkg.var"              ion-charge rule (real 1-D): d+1 on the slots > 0 among the first n, n the live
#                                    value of the integer scalar pkg.var; every other slot keeps d
#   phase   = "PRE" | "POST"         force the phase (default: POST for dynamic arrays, PRE otherwise)
#   config  = "steady" | "timestep"  the configuration the variant runs in (default: steady)
#   families = ["d_only", ...]       with values: the families the listed values (and others) run in; every other
#                                    family keeps the default rule's id for the key (AIUE-257, owner 2026-11-12)
#   rest_exclude = "..."             with families: the other families get the key EXCLUDED with this reason instead
# The meth* values are in the rules table of harness/variants.py, not here. Character variables are EXCLUDED by the
# type rule there.
#
# Owner rule (decision 23): if the meaning of an index, term, flag or yldot layout is uncertain, or a test, variant
# or block behaves irregularly, stop and ask the epic owner and record the answer on the ticket page. Never adjust a
# tolerance, exclusion, override or indexing to make a test pass.

