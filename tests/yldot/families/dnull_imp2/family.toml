input_changes = "normal form: bbb.restart=1 (8) and the state restore (275-282) removed; aph.aphdir, api.apidir set to ../../data; com.coronalimpfname = ../../data/mist_c.dat (the case's mist.dat); bbb.afracs=0.02 moved after allocate (owner, 2026-10-19: 0.02 on every cell, the case as run; set before it, 3860 of 3864 cells stayed 0); the first exmain (286-290) replaced by albedo_by_user=1, alblb/albrb filled from albedolb/albedorb and albedoi/albedoo read from inputs.h5 (the owner's fwdB.hdf5 setup/detected), then the owner's overrides; diffusivities read from inputs.h5"

[reference_state]
