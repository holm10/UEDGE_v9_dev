# yldot suite family (epic AIUE-9, PRD section 4/6/7.1), an owner case. Written by AIUE-91 (make_base_state.py,
# round-trip re-save: AIUE-140; [regions]: owner, 2026-10-21); W, P, child reuse, [history]: AIUE-92.
# Release assets (gridue.hdf5, inputs.h5, both states) are not in git: their SHA-256s are in
# references/dnull_imp2.manifest.json only (owner, 2026-10-21); tools/fetch_data.py fetches them.
# D, isimpon=2 (fixed-fraction carbon), double null 82x44 (nxpt=2); large role shared with large_dd2c (owner, 2026-10-19)

