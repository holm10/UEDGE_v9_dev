# yldot suite family (epic AIUE-9, PRD section 4/6/7.1), an owner case. Written by AIUE-91 (make_base_state.py,
# round-trip re-save: AIUE-140; [regions]: owner, 2026-10-21); W, P, child reuse, [history]: AIUE-92.
# Release assets (gridue.hdf5, inputs.h5, both states) are not in git: their SHA-256s are in
# references/large_dd2c.manifest.json only (owner, 2026-10-21); tools/fetch_data.py fetches them.
# D+D2+C (ishymol=1, isimpon=6), snull 54x31; large role shared with dnull_imp2 (owner, 2026-10-19)

[family]
name = "large_dd2c"
grid = "gridue.hdf5"
store = "sketch"  # owner, 2026-10-19
rate_files = ["ehr2.dat", "C_rates.adas"]  # in ../../data (tests/yldot/data), through aph.aphdir / api.apidir / com.coronalimpfname;
                # relative paths: every evaluation must run with the family directory as cwd
neq = 29568

[source]
owner = "epic owner"
delivered = "2026-10-19"
case = "mols_hires"  # the owner's case directory
input = "input.py"
input_sha256 = "1afeec376ad6baffcd1ec8a99f00fec7df27c623ae0751f9012bcf3270a0c45e"
grid = "gridue.hdf5"
grid_sha256 = "7baa289d73888b47d333126ffd5cbdd6bb0d405eaae38e6adf5ee38789d2a059"
state = "Dcrm.hdf5"
state_sha256 = "adfef09c5ceac8347c6ceb57164b9b1681f36ba2d32e38de50487e2e8ae20840"
input_changes = "normal form: bbb.restart=1 (8) and the state restore (285-292) removed; aph.aphdir, api.apidir set to ../../data; diffusivities read from inputs.h5 (the owner's Dcrm.hdf5 diffusivities/bbb, verbatim) instead of the state file"

[reference_state]
file = "reference_state.h5"
origin = "owner case state (Dcrm.hdf5), used as supplied, no reconvergence (owner, 2026-10-19); re-saved after one exmain, a round-trip fixed point (owner, 2026-10-21, AIUE-140)"
norm = "nksol max |sfscal*yldot| <= ftol"
ftol = 1e-08
fmax = 1.9361e+00
fnrm_l2 = 1.9497e+01
converged = false  # information only, gates nothing
build_commit = "8631c34dca7e24d9fbb29a5ee38a354ea9d14c0f"
build = "serial"
uedge_ver = "8.1.2-beta.0"

[perturbation]
sigma = 0.03
seed = 91001
rule = "every (equation, species) block: RMS(raw yldot at base) / RMS(at reference) >= 10"
min_block_ratio = 11.72
floors = "te, ti >= temin*ev; tg >= tgmin*ev; ng >= 0.1*ngbackg(igsp); impurity ni >= 0.1*nzbackg(ifld)"
near_floor_factor = 1.1
near_floor_tes = { reference = 0, base = 0 }
near_floor_tis = { reference = 0, base = 0 }
near_floor_tgs = { reference = 0, base = 0 }
near_floor_ngs = { reference = 0, base = 0 }
near_floor_nis_imp = { reference = 0, base = 0 }
source_state_sha256 = "adfef09c5ceac8347c6ceb57164b9b1681f36ba2d32e38de50487e2e8ae20840"
roundtrip_fixed_point = true  # both states: one exmain changes no saved entry (AIUE-140)
roundtrip_changes_source = { nis = 0, ups = 0, tes = 0, tis = 0, phis = 0, ngs = 0, tgs = 0 }

[limiter_report]
flalfe_qr_ge_1_reference = 0
flalfe_qr_ge_1_base = 115

[evaluation]  # measured (AIUE-92, [history]): W = P = 1, no child reuse (owner rule, 2026-10-21, AIUE-86)
w = 1  # exmain warm-up count, PRD section 6 step 5
p = 1  # pandf repeats, steps 8 and 8b
child_reuse = false  # one fresh child per evaluation (owner, 2026-10-21, AIUE-86)
timeout_s = 120  # per child
dt_timestep_s = 1e-6  # timestep configuration, step 6c

[history]  # tools/measure_history.py run (AIUE-92): rows that differ bit for bit, yldot plus yldot_J
measured = "2026-10-23"  # re-measured on an idle machine (AIUE-92 B8)
build = "AIUE-92-serial"  # 6ccd347 Fortran (unchanged since), --serial, one thread, Darwin arm64; tests/ at 4f83c77
uedge_ver = "8.1.2-beta.0"
w_sweep = { steady = [0, 0], timestep = [0, 0] }  # exmain x 1 vs 2, 2 vs 3, each in a fresh process (p = 1)
p_sweep = { steady = [0, 0], timestep = [0, 0] }  # pandf x 1 vs 2, 2 vs 3 (w = 1)
control_two_processes = { steady = 0, timestep = 0 }  # w = p = 1 in two processes
flag_sequence = { steady = 0, timestep = 0 }  # one more pandf at -1 and at +1 after step 8b, same process
steady_plus_minus_rows = 0  # steady yldot_J vs yldot
gated_rows = 0  # of those, removed by ishosor = 0 (the only flag-gated branch active in steady)
flags = { ishosor = 0, ismcnon = 0 }
reuse = "bit-identical: steady, steady, timestep, steady, intake, steady"  # one process; report only
child_wall_s = { steady = 0.2725, timestep = 0.3601 }  # one Runner child (forkserver), median of 5
eval_in_child_s = { steady = 0.3007, timestep = 0.3572 }  # the protocol inside the child, input.py included
pandf_s = 1.16e-02  # one pandf, median of 5
n_variants = { steady = 975, timestep = 9 }  # variants.plan(), not excluded
sweep_cpu_s = 269  # n_variants x child_wall_s

[regions]
# owner, 2026-10-21 (AIUE-91 ticket page, D1): six disjoint regions, one guard region; inner = the ix = 0 side
guard = "ix in {0, nx+1} or iy in {0, ny+1}"
nx = 54
ny = 31
ix_inner_leg = [1, 13]
ix_core = [14, 43]
ix_outer_leg = [44, 54]
iy_closed = [1, 15]  # core and private flux
iy_open = [16, 31]  # SOL and legs
source = { ixpt1 = 13, ixpt2 = 43, iysptrx = 15 }  # mhdgeo = 1: com.ixpt1, ixpt2, iysptrx
cells = { guard = 174, core = 450, pf = 360, inner_leg = 208, sol = 480, outer_leg = 176 }
