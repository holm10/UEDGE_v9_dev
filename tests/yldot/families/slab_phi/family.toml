# yldot suite family (epic AIUE-9, PRD section 4/6/7.1). Written by AIUE-81; later tickets add their keys:
# [evaluation]: AIUE-82 (placeholders), W, P, child_reuse measured: AIUE-86 · [history]: AIUE-86 · [regions], guard cells: AIUE-83 · round-trip re-save: AIUE-140

[family]
name = "slab_phi"
grid = "generated"  # slab mesh generated from the grd.* settings in input.py; no grid file
store = "full"
rate_files = ["ehr2.dat"]  # in ../../data (tests/yldot/data), through aph.aphdir / api.apidir in input.py;
                # relative paths: every evaluation must run with the family directory as cwd
neq = 4522

[source]
repo = "llnl/UEDGE"
ref = "b535508"  # branch pytests
input = "pytests/unittests/slab_D_only/slab/default/input.py"
grid = "templates/grids/slab/gridue"  # 0 bytes in the source, not copied
state = "templates/grids/slab/solution.h5"
state_sha256 = "e8eee22ddc1dc81583576f00f309fbaea91c868074f9be75e261635d42724880"
input_changes = "normal form: trailing restart/allocate/hdf5_restore lines (164-166) removed; aph.aphdir set"

[reference_state]
file = "reference_state.h5"
origin = "pytests template state, no reconvergence (owner, 2026-10-19); re-saved after one exmain, a round-trip fixed point (owner, 2026-10-21, AIUE-140)"
norm = "nksol max |sfscal*yldot| <= ftol"
ftol = 1e-08
fmax = 1.1460e-11
fnrm_l2 = 1.3273e-11
converged = true  # information only, gates nothing
build_commit = "c82a515b416db8f5a710f47133a5361107df84cd"
build = "serial"
uedge_ver = "8.1.2-beta.0"

[perturbation]
sigma = 0.02
seed = 81005
rule = "every (equation, species) block: RMS(raw yldot at base) / RMS(at reference) >= 10"
min_block_ratio = 8.726e+11
floors = "te, ti >= temin*ev; tg >= tgmin*ev; ng >= 0.1*ngbackg(igsp); impurity ni >= 0.1*nzbackg(ifld)"
near_floor_factor = 1.1
near_floor_tes = { reference = 0, base = 0 }
near_floor_tis = { reference = 0, base = 0 }
near_floor_tgs = { reference = 0, base = 0 }
near_floor_ngs = { reference = 0, base = 0 }
base_state_sha256 = "eafafbac5331ab3e48741507ac7dfda775039c3770e5087d952daaaf72f8b800"
reference_state_sha256 = "8ffb1bd5537b9964d8c4065c1f253da882f60cb9f3ef44ccaa836db8895c39f8"
base_state_data_sha256 = "3526d6218b860c1a12c4c28ee249e1a839fd24a14e2fee415085245c7116b2db"
reference_state_data_sha256 = "1081d866e3986436b0d626015788d727e20916020a841979bc07c44ddb61a6bf"
roundtrip_fixed_point = true  # both states: one exmain changes no saved entry (AIUE-140)
roundtrip_changes_source = { nis = 0, ups = 41, tes = 86, tis = 78, phis = 0, ngs = 0, tgs = 78 }

[limiter_report]
flalfe_qr_ge_1_reference = 81
flalfe_qr_ge_1_base = 83

[evaluation]  # measured (AIUE-86, [history]); owner, 2026-10-21: W = P = 1, no child reuse
w = 1  # exmain warm-up count, PRD section 6 step 5
p = 1  # pandf repeats, steps 8 and 8b
child_reuse = false  # one fresh child per evaluation (owner, 2026-10-21, AIUE-86)
timeout_s = 120  # per child
dt_timestep_s = 1e-6  # timestep configuration, step 6c

[history]  # tools/measure_history.py run (AIUE-86): rows that differ bit for bit, yldot plus yldot_J
measured = "2026-10-21"
build = "base-7c02d8d-serial"  # origin/v9-develop 7c02d8d, --serial, one thread, Darwin arm64
uedge_ver = "8.1.2-beta.0"
w_sweep = { steady = [0, 0], timestep = [0, 0] }  # exmain x 1 vs 2, 2 vs 3, each in a fresh process (p = 1)
p_sweep = { steady = [0, 0], timestep = [0, 0] }  # pandf x 1 vs 2, 2 vs 3 (w = 1)
control_two_processes = { steady = 0, timestep = 0 }  # w = p = 1 in two processes
flag_sequence = { steady = 0, timestep = 0 }  # one more pandf at -1 and at +1 after step 8b, same process
steady_plus_minus_rows = 0  # steady yldot_J vs yldot
gated_rows = 0  # of those, removed by ishosor = 0 (the only flag-gated branch active in steady)
flags = { ishosor = 0, ismcnon = 0 }
reuse = "bit-identical: steady, steady, timestep, steady, intake, steady"  # one process; report only
child_wall_s = { steady = 0.0903, timestep = 0.0995 }  # one Runner child (forkserver), median of 5
eval_in_child_s = { steady = 0.0699, timestep = 0.075 }  # the protocol inside the child, input.py included
pandf_s = 7.75e-04  # one pandf, median of 5
n_variants = { steady = 983, timestep = 9 }  # variants.plan(), not excluded
sweep_cpu_s = 90  # n_variants x child_wall_s

[regions]  # owner, 2026-10-20 (AIUE-83 ticket page): mhdgeo = -1, so geometry does not apply; the mesh comes from
           # nxcore/nxleg: a half mesh with a reflective (symmetry) boundary at ix = 0 and one divertor leg, core/SOL
           # split by nycore/nysol. The ixpt1 = 12, ixpt2 = 20 that isgrdsym = 1 produces are not used.
guard = "ix in {0, nx+1} or iy in {0, ny+1}"
nx = 32
ny = 17
ix_inner_leg = []
ix_core = [1, 8]
ix_outer_leg = [9, 32]
iy_closed = [1, 1]  # core and private flux
iy_open = [2, 17]  # SOL and leg
source = { nxcore = 8, nxleg = 24, nycore = 1 }  # com.nxcore[0,1], nxleg[0,1], nycore[0]
cells = { guard = 102, core = 8, pf = 24, inner_leg = 0, sol = 128, outer_leg = 384 }
