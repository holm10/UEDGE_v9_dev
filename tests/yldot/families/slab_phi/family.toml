# yldot suite family (epic AIUE-9, PRD section 4/6/7.1). Written by AIUE-81; later tickets add their keys:
# [evaluation] placeholders: AIUE-82 · W, P, child reuse measured: AIUE-86 · [regions], guard cells: AIUE-83

[family]
name = "slab_phi"
grid = "generated"  # slab mesh generated from the grd.* settings in input.py; no grid file
store = "full"
rate_files = ["ehr2.dat"]  # in ../../data (tests/yldot/data), through aph.aphdir / api.apidir in input.py;
                # relative paths: every evaluation must run with the family directory as cwd
neq = 4522

[source]
repo = "llnl/UEDGE"
ref = "b535508"  # branch pytests
input = "pytests/unittests/slab_D_only/slab/default/input.py"
grid = "templates/grids/slab/gridue"  # 0 bytes in the source, not copied
state = "templates/grids/slab/solution.h5"
state_sha256 = "e8eee22ddc1dc81583576f00f309fbaea91c868074f9be75e261635d42724880"
input_changes = "normal form: trailing restart/allocate/hdf5_restore lines (164-166) removed; aph.aphdir set"

[reference_state]
file = "reference_state.h5"
origin = "pytests template state, used as is, no reconvergence (owner, 2026-10-19)"
norm = "nksol max |sfscal*yldot| <= ftol"
ftol = 1e-08
fmax = 1.1460e-11
fnrm_l2 = 1.3273e-11
converged = true  # information only, gates nothing
build_commit = "e7f5e9f4d63b838261af682649aa6e610e799bb7"
build = "serial"
uedge_ver = "8.1.2-beta.0"

[perturbation]
sigma = 0.02
seed = 81005
rule = "every (equation, species) block: RMS(raw yldot at base) / RMS(at reference) >= 10"
min_block_ratio = 8.728e+11
floors = "te, ti >= temin*ev; tg >= tgmin*ev; ng >= 0.1*ngbackg(igsp); impurity ni >= 0.1*nzbackg(ifld)"
near_floor_factor = 1.1
near_floor_tes = { reference = 0, base = 0 }
near_floor_tis = { reference = 0, base = 0 }
near_floor_tgs = { reference = 0, base = 0 }
near_floor_ngs = { reference = 0, base = 0 }
base_state_sha256 = "7df5dab5e53e106ff6b36278c925170b17082b8d5bd21088fb229583ecc90d89"
reference_state_sha256 = "b8c374687ee807fc1e75469d51b42e947b757f7ae1f8b1c525e60185c86567ea"
base_state_data_sha256 = "95db413199dad508fe90dcb0bc6be8cc1c6c33806007e1fb1d344a8acc1dced3"
reference_state_data_sha256 = "869efdcdb00d204348b1e6937b29bed197c34afb300e0e3770a64ac0567718df"

[limiter_report]
flalfe_qr_ge_1_reference = 81
flalfe_qr_ge_1_base = 83

[evaluation]  # placeholders (owner, 2026-10-19) until AIUE-86 measures them
w = 2  # exmain warm-up count, PRD section 6 step 5
p = 2  # pandf repeats, steps 8 and 8b
timeout_s = 120  # per child
dt_timestep_s = 1e-6  # timestep configuration, step 6c

[regions]  # owner, 2026-10-20 (AIUE-83 ticket page): mhdgeo = -1, so geometry does not apply; the mesh comes from
           # nxcore/nxleg: a half mesh with a reflective (symmetry) boundary at ix = 0 and one divertor leg, core/SOL
           # split by nycore/nysol. The ixpt1 = 12, ixpt2 = 20 that isgrdsym = 1 produces are not used.
guard = "ix in {0, nx+1} or iy in {0, ny+1}"
nx = 32
ny = 17
ix_inner_leg = []
ix_core = [1, 8]
ix_outer_leg = [9, 32]
iy_closed = [1, 1]  # core and private flux
iy_open = [2, 17]  # SOL and leg
source = { nxcore = 8, nxleg = 24, nycore = 1 }  # com.nxcore[0,1], nxleg[0,1], nycore[0]
cells = { guard = 102, core = 8, pf = 24, inner_leg = 0, sol = 128, outer_leg = 384 }
