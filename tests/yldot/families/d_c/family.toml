# yldot suite family (epic AIUE-9, PRD section 4/6/7.1). Written by AIUE-81; later tickets add their keys:
# [evaluation] placeholders: AIUE-82 · W, P, child reuse, [history]: AIUE-86 · [regions], guard cells: AIUE-83 · round-trip re-save: AIUE-140

[family]
name = "d_c"
grid = "gridue_16x8"
store = "full"
rate_files = ["ehr2.dat", "C_rates.strahl"]  # in ../../data (tests/yldot/data), through aph.aphdir / api.apidir in input.py;
                # relative paths: every evaluation must run with the family directory as cwd
neq = 2340

[source]
repo = "llnl/UEDGE"
ref = "b535508"  # branch pytests
input = "templates/fulltests/nonog_d_c-fb_16x8/input.py"
grid = "templates/fulltests/nonog_d_c-fb_16x8/gridue_16x8"
state = "templates/fulltests/nonog_d_c-fb_16x8/solution.h5"
state_sha256 = "8c98c8d825169e80dbced67e0fc814a4a67a1d96cb5a44dad3fd394d2b53307f"
input_changes = "normal form: bbb.restart = 1 (132) and allocate + hdf5_restore (143-144) removed; aph.aphdir, api.apidir set"

[reference_state]
file = "reference_state.h5"
origin = "pytests template state, no reconvergence (owner, 2026-10-19); re-saved after one exmain, a round-trip fixed point (owner, 2026-10-21, AIUE-140)"
norm = "nksol max |sfscal*yldot| <= ftol"
ftol = 1e-08
fmax = 3.9466e-05
fnrm_l2 = 8.9816e-05
converged = false  # information only, gates nothing
build_commit = "c82a515b416db8f5a710f47133a5361107df84cd"
build = "serial"
uedge_ver = "8.1.2-beta.0"

[perturbation]
sigma = 0.02
seed = 81003
rule = "every (equation, species) block: RMS(raw yldot at base) / RMS(at reference) >= 10"
min_block_ratio = 1.671e+06
floors = "te, ti >= temin*ev; tg >= tgmin*ev; ng >= 0.1*ngbackg(igsp); impurity ni >= 0.1*nzbackg(ifld)"
near_floor_factor = 1.1
near_floor_tes = { reference = 0, base = 0 }
near_floor_tis = { reference = 0, base = 0 }
near_floor_tgs = { reference = 0, base = 0 }
near_floor_ngs = { reference = 0, base = 0 }
near_floor_nis_imp = { reference = 0, base = 0 }
base_state_sha256 = "83ffc5c3650c9d6abdb62abc387b8515bb6403b80a4101a96a497d32afea8a79"
reference_state_sha256 = "9cfa2fb887f9a046dbbebe821b9cc9cca9d887e232a542941711bc3ffdc80fd0"
base_state_data_sha256 = "b5db9d4c89ae94f65b63619d342ce45745d6472f3a0dd3352e0d4ddb998ecfe1"
reference_state_data_sha256 = "1b97fbf177bbbc212826287cec020c3336285be703cab6b86da8971387507256"
roundtrip_fixed_point = true  # both states: one exmain changes no saved entry (AIUE-140)
roundtrip_changes_source = { nis = 0, ups = 13, tes = 21, tis = 13, phis = 0, ngs = 0, tgs = 13 }

[limiter_report]
flalfe_qr_ge_1_reference = 0
flalfe_qr_ge_1_base = 25

[evaluation]  # measured (AIUE-86, [history]); owner, 2026-10-21: W = P = 1, no child reuse
w = 1  # exmain warm-up count, PRD section 6 step 5
p = 1  # pandf repeats, steps 8 and 8b
child_reuse = false  # one fresh child per evaluation (owner, 2026-10-21, AIUE-86)
timeout_s = 120  # per child
dt_timestep_s = 1e-6  # timestep configuration, step 6c

[history]  # tools/measure_history.py run (AIUE-86): rows that differ bit for bit, yldot plus yldot_J
measured = "2026-10-21"
build = "base-7c02d8d-serial"  # origin/v9-develop 7c02d8d, --serial, one thread, Darwin arm64
uedge_ver = "8.1.2-beta.0"
w_sweep = { steady = [0, 0], timestep = [0, 0] }  # exmain x 1 vs 2, 2 vs 3, each in a fresh process (p = 1)
p_sweep = { steady = [0, 0], timestep = [0, 0] }  # pandf x 1 vs 2, 2 vs 3 (w = 1)
control_two_processes = { steady = 0, timestep = 0 }  # w = p = 1 in two processes
flag_sequence = { steady = 0, timestep = 0 }  # one more pandf at -1 and at +1 after step 8b, same process
steady_plus_minus_rows = 0  # steady yldot_J vs yldot
gated_rows = 0  # of those, removed by ishosor = 0 (the only flag-gated branch active in steady)
flags = { ishosor = 0, ismcnon = 0 }
reuse = "bit-identical: steady, steady, timestep, steady, intake, steady"  # one process; report only
child_wall_s = { steady = 0.081, timestep = 0.0963 }  # one Runner child (forkserver), median of 5
eval_in_child_s = { steady = 0.0748, timestep = 0.0792 }  # the protocol inside the child, input.py included
pandf_s = 7.55e-04  # one pandf, median of 5
n_variants = { steady = 983, timestep = 9 }  # variants.plan(), not excluded
sweep_cpu_s = 80  # n_variants x child_wall_s

[regions]  # owner, 2026-10-20 (AIUE-83 ticket page): six disjoint regions, one guard region; inner = the ix = 0 side
guard = "ix in {0, nx+1} or iy in {0, ny+1}"
nx = 16
ny = 8
ix_inner_leg = [1, 4]
ix_core = [5, 12]
ix_outer_leg = [13, 16]
iy_closed = [1, 4]  # core and private flux
iy_open = [5, 8]  # SOL and legs
source = { ixpt1 = 4, ixpt2 = 12, iysptrx = 4 }  # mhdgeo = 1: com.ixpt1, ixpt2, iysptrx
cells = { guard = 52, core = 32, pf = 32, inner_leg = 16, sol = 32, outer_leg = 16 }
