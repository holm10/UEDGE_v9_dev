# yldot suite family (epic AIUE-9, PRD section 4/6/7.1), an owner case. Written by AIUE-91 (make_base_state.py,
# round-trip re-save: AIUE-140; [regions]: owner, 2026-10-21); W, P, child reuse, [history]: AIUE-92.
# Release assets (gridue.hdf5, inputs.h5, both states) are not in git: their SHA-256s are in
# references/imp7.manifest.json only (owner, 2026-10-21); tools/fetch_data.py fetches them.
# isimpon=7: fixed-fraction neon (mist_ne.dat, afracs=1.5e-2) with force-balance carbon, upper single null 70x42 (owner, 2026-10-19)

[family]
name = "imp7"
grid = "gridue.hdf5"
store = "sketch"  # owner, 2026-10-19
rate_files = ["ehr2.dat", "C_rates.adas", "mist_ne.dat"]  # in ../../data (tests/yldot/data), through aph.aphdir / api.apidir / com.coronalimpfname;
                # relative paths: every evaluation must run with the family directory as cwd
neq = 44352

[source]
owner = "epic owner"
delivered = "2026-10-19"
case = "isimpon7"  # the owner's case directory
input = "input_mod4.py"
input_sha256 = "ec4b68a0099e9fabf736ea45f1184b1fbb6a271ecf6f003aaf17aef1ba5eecc5"
grid = "gridue.hdf5"
grid_sha256 = "a4b38ab63e8ff5a951920a44b47f36a310ae04cc581eebfc8e96cc081122ab2f"
state = "b0p1.hdf5"
state_sha256 = "e0e4d590e415c3b6b4fbc73a8601fcc432bbed1f4c5e56786fb2806b7d9abaf5"
mist = "mist.dat"
mist_sha256 = "3547f7d703dd90111094eda0cd9567146198de7d22e5b0a41b08bd4649f6b7cb"
input_changes = "normal form: aph.aphdir, api.apidir set to ../../data (were commented out); bbb.restart=1 (8), the state restore (276-284) and the closing hdf5_restore (338) removed; bbb.isimpon=7 from the start (the owner's input set 6 and switched after its first exmain); com.coronalimpfname = ../../data/mist_ne.dat (the case's mist.dat); the first exmain (288-292) replaced by albedo_by_user=1, alblb/albrb filled from albedolb/albedorb and albedoi/albedoo read from inputs.h5 (the owner's b0p1.hdf5 setup/detected), then the owner's overrides; diffusivities read from inputs.h5; com.redopltvtag = 1 added (AIUE-164, AIUE-170, owner 2026-10-23)"

[reference_state]
file = "reference_state.h5"
origin = "owner case state (b0p1.hdf5), used as supplied, no reconvergence (owner, 2026-10-19); re-saved after one exmain, a round-trip fixed point (owner, 2026-10-21, AIUE-140); evaluated with com.redopltvtag = 1 (AIUE-170): the saved data are unchanged (data sha256 identical to the states made without it), not re-converged (owner, 2026-10-23)"
norm = "nksol max |sfscal*yldot| <= ftol"
ftol = 1e-08
fmax = 1.5375e-02  # with com.redopltvtag = 1 (AIUE-170); 1.5370e-10 before
fnrm_l2 = 5.8358e-02
converged = false  # information only, gates nothing
build_commit = "c6de66bee6860c007a1e9e8d275b89b04857a0ae"  # the build measured (AIUE-170's base); the deck already had AIUE-170's redopltvtag line
build = "serial"
uedge_ver = "8.1.2-beta.0"

[perturbation]
sigma = 0.02
seed = 91003
rule = "every (equation, species) block: RMS(raw yldot at base) / RMS(at reference) >= 10"
min_block_ratio = 37.75  # with com.redopltvtag = 1 (AIUE-170); 1.249e10 before
floors = "te, ti >= temin*ev; tg >= tgmin*ev; ng >= 0.1*ngbackg(igsp); impurity ni >= 0.1*nzbackg(ifld)"
near_floor_factor = 1.1
near_floor_tes = { reference = 0, base = 0 }
near_floor_tis = { reference = 0, base = 0 }
near_floor_tgs = { reference = 0, base = 0 }
near_floor_ngs = { reference = 0, base = 0 }
near_floor_nis_imp = { reference = 0, base = 0 }
source_state_sha256 = "e0e4d590e415c3b6b4fbc73a8601fcc432bbed1f4c5e56786fb2806b7d9abaf5"
roundtrip_fixed_point = true  # both states: one exmain changes no saved entry (AIUE-140)
roundtrip_changes_source = { nis = 0, ups = 160, tes = 8, tis = 1, phis = 0, ngs = 0, tgs = 2 }

[limiter_report]
flalfe_qr_ge_1_reference = 159
flalfe_qr_ge_1_base = 902

[evaluation]  # measured (AIUE-92, [history]): W = P = 1, no child reuse (owner rule, 2026-10-21, AIUE-86)
w = 1  # exmain warm-up count, PRD section 6 step 5
p = 1  # pandf repeats, steps 8 and 8b
child_reuse = false  # one fresh child per evaluation (owner, 2026-10-21, AIUE-86)
timeout_s = 120  # per child
dt_timestep_s = 1e-6  # timestep configuration, step 6c

[history]  # tools/measure_history.py run (AIUE-92): rows that differ bit for bit, yldot plus yldot_J
measured = "2026-10-23"  # re-measured on an idle machine (AIUE-92 B8)
build = "AIUE-92-serial"  # 6ccd347 Fortran (unchanged since), --serial, one thread, Darwin arm64; tests/ at 4f83c77
uedge_ver = "8.1.2-beta.0"
w_sweep = { steady = [0, 0], timestep = [0, 0] }  # exmain x 1 vs 2, 2 vs 3, each in a fresh process (p = 1)
p_sweep = { steady = [0, 0], timestep = [0, 0] }  # pandf x 1 vs 2, 2 vs 3 (w = 1)
control_two_processes = { steady = 0, timestep = 0 }  # w = p = 1 in two processes
flag_sequence = { steady = 0, timestep = 0 }  # one more pandf at -1 and at +1 after step 8b, same process
steady_plus_minus_rows = 0  # steady yldot_J vs yldot
gated_rows = 0  # of those, removed by ishosor = 0 (the only flag-gated branch active in steady)
flags = { ishosor = 0, ismcnon = 0 }
reuse = "bit-identical: steady, steady, timestep, steady, intake, steady"  # one process; report only
child_wall_s = { steady = 0.8569, timestep = 1.1655 }  # one Runner child (forkserver), median of 5
eval_in_child_s = { steady = 0.8415, timestep = 1.083 }  # the protocol inside the child, input.py included
pandf_s = 1.96e-02  # one pandf, median of 5
n_variants = { steady = 975, timestep = 9 }  # variants.plan(), not excluded
sweep_cpu_s = 846  # n_variants x child_wall_s

[regions]
# owner, 2026-10-21 (AIUE-91 ticket page, D1): six disjoint regions, one guard region; inner = the ix = 0 side (upper single null too)
guard = "ix in {0, nx+1} or iy in {0, ny+1}"
nx = 70
ny = 42
ix_inner_leg = [1, 10]
ix_core = [11, 50]
ix_outer_leg = [51, 70]
iy_closed = [1, 12]  # core and private flux
iy_open = [13, 42]  # SOL and legs
source = { ixpt1 = 10, ixpt2 = 50, iysptrx = 12 }  # mhdgeo = 1: com.ixpt1, ixpt2, iysptrx
cells = { guard = 228, core = 480, pf = 360, inner_leg = 300, sol = 1200, outer_leg = 600 }
