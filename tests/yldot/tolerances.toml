# yldot tolerances (epic AIUE-9, PRD sections 7.4 and 7.7). Generated by
#   python tests/yldot/tools/measure_roundoff.py analyze <collections> --write   (AIUE-87); do not edit by hand.
# Owner decisions (2026-10-21, AIUE-87 ticket page): Linux pin Ubuntu 24.04 amd64 (tests/yldot/linux/);
# rtol_eq block-normalised, one value per equation; sigma_i over the serial pairs and both vectors;
# sigma stored per family in families/<f>/sigma.h5. OpenMP and --debug rows are report only.

[rule]
k = 100.0
rtol_factor = 100.0
rtol_floor = 1e-14
floor_limit = 0.1
floor = "PRD 7.4: tol_i = max(rtol_eq*|ref_i|, k*sigma_i) where sigma_i > 0; where sigma_i = 0, max(rtol_eq*|ref_i|, k*sigma_min,r), sigma_min,r the smallest non-zero sigma of the entry's (equation, species, region), else of its (equation, species) over the family, else the epic owner"
sigma = "max over the serial pairs of max(|d yldot_i|, |d yldot_J_i|), per family and configuration"
rtol = "max(rtol_factor * s, rtol_floor), s = max_i |d_i| / max_i |ref_i| over the equation's rows, d over yldot and yldot_J; the max over every family, configuration and serial pair"

